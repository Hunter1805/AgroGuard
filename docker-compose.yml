version: '3.8'

services:
  agroguard-postgres:
    image: postgres:16-alpine
    container_name: agroguard-postgres
    restart: always
    environment:
      POSTGRES_USER: agroguard
      POSTGRES_PASSWORD: agroguard_dev_password
      POSTGRES_DB: agroguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroguard -d agroguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
